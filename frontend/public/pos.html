<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Kasir - Sistem Inventaris UMKM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/pos.css" />
</head>
<body>
  
  <div class="pos-container">
    
    <!-- Left Panel: Product List -->
    <div class="product-panel">
      <div class="panel-header">
        <div class="header-top">
          <div class="user-badge">
            <i class="bi bi-person-circle"></i>
            <div>
              <div class="user-name" id="kasir-name">Kasir</div>
              <div class="user-role">Point of Sale</div>
            </div>
          </div>
          <button class="btn-logout-mini" id="btn-logout" title="Logout">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>

        <div class="search-box">
          <i class="bi bi-search"></i>
          <input 
            type="text" 
            id="search-product" 
            placeholder="Cari produk (kode/nama)..." 
            autocomplete="off"
          />
          <button class="btn-clear" id="btn-clear-search" title="Clear">
            <i class="bi bi-x"></i>
          </button>
        </div>

        <div class="category-filter" id="category-filter">
          <button class="filter-btn active" data-kategori="all">Semua</button>
          <!-- Kategori akan di-generate oleh JS -->
        </div>
      </div>

      <div class="product-grid" id="product-grid">
        <div class="loading-state">
          <div class="spinner-border text-primary"></div>
          <p>Memuat produk...</p>
        </div>
      </div>
    </div>

    <!-- Right Panel: Cart & Checkout -->
    <div class="cart-panel">
      <div class="cart-header">
        <h4>
          <i class="bi bi-cart3"></i>
          Keranjang Belanja
        </h4>
        <div class="date-time" id="datetime"></div>
      </div>

      <div class="cart-items" id="cart-items">
        <div class="empty-cart">
          <i class="bi bi-cart-x"></i>
          <p>Keranjang masih kosong</p>
          <small>Pilih produk untuk memulai transaksi</small>
        </div>
      </div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="subtotal">Rp 0</strong>
        </div>
        <div class="summary-row total">
          <span>TOTAL</span>
          <strong id="total">Rp 0</strong>
        </div>
      </div>

      <div class="cart-actions">
        <button class="btn-action btn-clear-cart" id="btn-clear-cart">
          <i class="bi bi-trash"></i>
          Bersihkan
        </button>
        <button class="btn-action btn-checkout" id="btn-checkout">
          <i class="bi bi-check-circle"></i>
          Checkout
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Checkout -->
  <div class="modal fade" id="modal-checkout" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-cash-coin me-2"></i>
            Pembayaran
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="checkout-summary">
            <div class="summary-row">
              <span>Total Belanja</span>
              <strong id="checkout-total">Rp 0</strong>
            </div>
          </div>

          <form id="form-checkout">
            <div class="mb-3">
              <label class="form-label">Nama Pelanggan (Opsional)</label>
              <input 
                type="text" 
                class="form-control" 
                id="pelanggan-name" 
                placeholder="Masukkan nama pelanggan"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Jumlah Bayar <span class="text-danger">*</span></label>
              <div class="input-group input-group-lg">
                <span class="input-group-text">Rp</span>
                <input 
                  type="number" 
                  class="form-control" 
                  id="bayar-amount" 
                  placeholder="0" 
                  min="0"
                  required
                />
              </div>
            </div>

            <div class="kembalian-box" id="kembalian-box" style="display: none;">
              <div class="kembalian-label">Kembalian</div>
              <div class="kembalian-value" id="kembalian-value">Rp 0</div>
            </div>

            <div class="alert alert-danger d-none" id="alert-bayar">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span id="alert-bayar-text"></span>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary btn-lg" id="btn-process-payment">
            <i class="bi bi-check-circle me-2"></i>
            Proses Pembayaran
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Struk -->
  <div class="modal fade" id="modal-struk" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">
            <i class="bi bi-check-circle-fill me-2"></i>
            Transaksi Berhasil
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="struk-container" id="struk-container">
            <!-- Struk akan di-generate oleh JS -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary" id="btn-print-struk">
            <i class="bi bi-printer me-2"></i>
            Print Struk
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
