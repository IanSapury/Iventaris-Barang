<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Barang - Sistem Inventaris UMKM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-box-seam"></i>
        <span>Inventaris</span>
      </div>
    </div>

    <div class="sidebar-menu">
      <a href="/dashboard.html" class="menu-item">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
      <a href="/barang.html" class="menu-item active">
        <i class="bi bi-boxes"></i>
        <span>Data Barang</span>
      </a>
      <a href="/transaksi-masuk.html" class="menu-item">
        <i class="bi bi-arrow-down-circle"></i>
        <span>Barang Masuk</span>
      </a>
      <a href="/transaksi-keluar.html" class="menu-item">
        <i class="bi bi-arrow-up-circle"></i>
        <span>Barang Keluar</span>
      </a>
      <a href="/laporan.html" class="menu-item">
        <i class="bi bi-file-earmark-bar-graph"></i>
        <span>Laporan</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="user-details">
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
      <button class="btn-logout" id="btn-logout">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="main-content">
    
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-toggle" id="mobile-toggle">
          <i class="bi bi-list"></i>
        </button>
        <h1 class="page-title">
          <i class="bi bi-boxes me-2"></i>
          Data Barang
        </h1>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="btn-add-barang">
          <i class="bi bi-plus-circle me-2"></i>
          Tambah Barang
        </button>
      </div>
    </div>

    <div class="container-fluid px-4 py-4">
      
      <!-- Search & Filter -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-search"></i>
                </span>
                <input 
                  type="text" 
                  class="form-control" 
                  id="search-barang"
                  placeholder="Cari kode barang, nama, kategori..."
                  autocomplete="off"
                />
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filter-kategori">
                <option value="">Semua Kategori</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filter-stok">
                <option value="">Semua Stok</option>
                <option value="available">Tersedia</option>
                <option value="low">Stok Rendah</option>
                <option value="empty">Habis</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Barang Table -->
      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th style="width: 40px">#</th>
                  <th style="width: 120px">Kode</th>
                  <th>Nama Barang</th>
                  <th style="width: 140px">Kategori</th>
                  <th class="text-end" style="width: 100px">Stok</th>
                  <th class="text-end" style="width: 140px">Harga</th>
                  <th class="text-center" style="width: 140px">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody-barang">
                <tr>
                  <td colspan="7" class="text-center py-4">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2 mb-0 text-muted">Memuat data...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer">
          <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted" id="info-count">0 barang</small>
            <button class="btn btn-sm btn-outline-primary" id="btn-refresh">
              <i class="bi bi-arrow-clockwise me-1"></i>
              Refresh
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Form Barang -->
  <div class="modal fade" id="modal-form" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">
            <i class="bi bi-plus-circle me-2"></i>
            Tambah Barang
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-barang">
            <input type="hidden" id="f-id" />

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Kode Barang <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="f-kode" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Nama Barang <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="f-nama" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Kategori <span class="text-danger">*</span></label>
                <select class="form-select" id="f-kategori" required>
                  <option value="">Pilih Kategori</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Stok <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="f-stok" min="0" required />
              </div>
              <div class="col-md-3">
                <label class="form-label">Satuan</label>
                <select class="form-select" id="f-satuan">
                  <option value="pcs">pcs</option>
                  <option value="unit">unit</option>
                  <option value="box">box</option>
                  <option value="kg">kg</option>
                  <option value="liter">liter</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Harga (Rp) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text">Rp</span>
                  <input type="number" class="form-control" id="f-harga" min="0" required />
                </div>
              </div>
              <div class="col-md-12">
                <label class="form-label">Keterangan</label>
                <textarea class="form-control" id="f-keterangan" rows="3"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" id="btn-save">
            <i class="bi bi-check-circle me-2"></i>
            Simpan
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/barang.js"></script>
</body>
</html>
