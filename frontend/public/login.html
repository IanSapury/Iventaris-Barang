<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistem Inventaris UMKM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background shapes */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -200px;
      right: -200px;
      animation: float 6s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      bottom: -100px;
      left: -100px;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(30px); }
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px 40px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .logo-icon i {
      font-size: 36px;
      color: white;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .logo-subtitle {
      font-size: 14px;
      color: #64748b;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 18px;
      transition: color 0.3s;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px 14px 48px;
      font-size: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.3s ease;
      background: #f8fafc;
    }

    .form-control:focus {
      border-color: #3b82f6;
      background: white;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .form-control:focus + .input-icon {
      color: #3b82f6;
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.3s;
    }

    .password-toggle:hover {
      color: #3b82f6;
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      margin-top: 8px;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-login .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 24px;
      display: none;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .alert-error i {
      margin-right: 8px;
    }

    .divider {
      text-align: center;
      margin: 28px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #e2e8f0;
    }

    .divider span {
      background: white;
      padding: 0 16px;
      position: relative;
      font-size: 13px;
      color: #94a3b8;
    }

    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      margin-top: 24px;
    }

    .info-box-title {
      font-size: 13px;
      font-weight: 600;
      color: #1e40af;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-box-content {
      font-size: 13px;
      color: #1e40af;
      line-height: 1.6;
    }

    .info-box-content strong {
      font-weight: 600;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* Responsive */
    @media (max-width: 576px) {
      .login-card {
        padding: 36px 28px;
      }

      .logo-title {
        font-size: 22px;
      }

      .info-box {
        display: none;
      }
    }
  </style>
</head>
<body>
  
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-icon">
          <i class="bi bi-box-seam"></i>
        </div>
        <h1 class="logo-title">Sistem Inventaris</h1>
        <p class="logo-subtitle">Manajemen Gudang UMKM</p>
      </div>

      <div id="alert-error" class="alert alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="alert-message"></span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              class="form-control" 
              placeholder="Masukkan username"
              autocomplete="username"
              required
            />
            <i class="input-icon bi bi-person-fill"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            />
            <i class="input-icon bi bi-lock-fill"></i>
            <button type="button" class="password-toggle" id="toggle-password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span id="btn-text">Masuk</span>
        </button>
      </form>

      <div class="info-box">
        <div class="info-box-title">
          <i class="bi bi-info-circle-fill"></i>
          Demo Login
        </div>
        <div class="info-box-content">
          <strong>Admin:</strong> admin / password123<br>
          <strong>Kasir:</strong> kasir1 / password123
        </div>
      </div>
    </div>

    <p class="footer-text">
      © 2026 Sistem Inventaris UMKM. All rights reserved.
    </p>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('toggle-password').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        passwordInput.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // Show error alert
    function showError(message) {
      const alert = document.getElementById('alert-error');
      const messageEl = document.getElementById('alert-message');
      messageEl.textContent = message;
      alert.style.display = 'block';
      
      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    // Handle login form submit
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btnLogin = document.getElementById('btn-login');
      const btnText = document.getElementById('btn-text');

      // Validation
      if (!username || !password) {
        showError('Username dan password wajib diisi');
        return;
      }

      // Disable button and show loading
      btnLogin.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>Memproses...';

      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          // Save user data to localStorage
          localStorage.setItem('token', result.data.token);
          localStorage.setItem('user', JSON.stringify(result.data.user));

          // Redirect based on role
          if (result.data.user.role === 'admin') {
            window.location.href = '/dashboard.html';
          } else {
            window.location.href = '/pos.html';
          }
        } else {
          showError(result.message || 'Login gagal');
          btnLogin.disabled = false;
          btnText.textContent = 'Masuk';
        }

      } catch (error) {
        console.error('Login error:', error);
        showError('Terjadi kesalahan. Silakan coba lagi.');
        btnLogin.disabled = false;
        btnText.textContent = 'Masuk';
      }
    });

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');

      if (token && user.role) {
        // Redirect to appropriate page
        if (user.role === 'admin') {
          window.location.href = '/dashboard.html';
        } else {
          window.location.href = '/pos.html';
        }
      }
    });
  </script>

  <!-- Load config first -->
  <script src="/js/config.js"></script>
  
  <script>
    // Update fetch URL to use CONFIG
    const API_BASE_URL = window.CONFIG ? window.CONFIG.API_BASE_URL : '/api';
  </script>
</body>
</html>
