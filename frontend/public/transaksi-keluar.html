<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History Transaksi Keluar - Sistem Inventaris UMKM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/transaksi.css" />
</head>
<body>
  
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-box-seam"></i>
        <span>Inventaris</span>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle">
        <i class="bi bi-list"></i>
      </button>
    </div>

    <div class="sidebar-menu">
      <a href="/dashboard.html" class="menu-item">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
      <a href="/barang.html" class="menu-item">
        <i class="bi bi-boxes"></i>
        <span>Data Barang</span>
      </a>
      <a href="/transaksi-masuk.html" class="menu-item">
        <i class="bi bi-arrow-down-circle"></i>
        <span>Barang Masuk</span>
      </a>
      <a href="/transaksi-keluar.html" class="menu-item active">
        <i class="bi bi-arrow-up-circle"></i>
        <span>Barang Keluar</span>
      </a>
      <a href="/laporan.html" class="menu-item">
        <i class="bi bi-file-earmark-bar-graph"></i>
        <span>Laporan</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="user-details">
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
      <button class="btn-logout" id="btn-logout">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="main-content">
    
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-toggle" id="mobile-toggle">
          <i class="bi bi-list"></i>
        </button>
        <h1 class="page-title">
          <i class="bi bi-arrow-up-circle me-2"></i>
          Transaksi Keluar (Penjualan)
        </h1>
      </div>
      <div class="topbar-right">
        <button class="btn-refresh" id="btn-refresh" title="Refresh Data">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>

    <!-- Stats Summary -->
    <div class="stats-grid" style="padding: 24px 32px;">
      <div class="stat-card-mini">
        <div class="stat-icon-mini bg-success">
          <i class="bi bi-cash-stack"></i>
        </div>
        <div>
          <div class="stat-label-mini">Total Penjualan</div>
          <div class="stat-value-mini" id="stat-total-penjualan">Rp 0</div>
        </div>
      </div>
      <div class="stat-card-mini">
        <div class="stat-icon-mini bg-primary">
          <i class="bi bi-receipt"></i>
        </div>
        <div>
          <div class="stat-label-mini">Total Transaksi</div>
          <div class="stat-value-mini" id="stat-total-transaksi">0</div>
        </div>
      </div>
      <div class="stat-card-mini">
        <div class="stat-icon-mini bg-info">
          <i class="bi bi-box-seam"></i>
        </div>
        <div>
          <div class="stat-label-mini">Total Item Terjual</div>
          <div class="stat-value-mini" id="stat-total-item">0</div>
        </div>
      </div>
    </div>

    <!-- Filter & Search -->
    <div class="filter-section">
      <div class="search-box-table">
        <i class="bi bi-search"></i>
        <input 
          type="text" 
          id="search-transaksi" 
          placeholder="Cari nomor transaksi, pelanggan, kasir..."
          autocomplete="off"
        />
      </div>
      <div class="filter-actions">
        <button class="btn-filter" id="btn-filter-today">
          <i class="bi bi-calendar-day"></i>
          Hari Ini
        </button>
        <button class="btn-filter" id="btn-filter-week">
          <i class="bi bi-calendar-week"></i>
          Minggu Ini
        </button>
        <button class="btn-filter" id="btn-filter-month">
          <i class="bi bi-calendar-month"></i>
          Bulan Ini
        </button>
        <button class="btn-filter active" id="btn-filter-all">
          <i class="bi bi-calendar-range"></i>
          Semua
        </button>
      </div>
    </div>

    <!-- Transaksi Table -->
    <div class="card" style="margin: 0 32px 32px;">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="table-transaksi">
            <thead>
              <tr>
                <th style="width: 40px">#</th>
                <th style="width: 180px">No. Transaksi</th>
                <th style="width: 160px">Tanggal</th>
                <th>Pelanggan</th>
                <th style="width: 80px">Item</th>
                <th class="text-end" style="width: 140px">Total</th>
                <th>Kasir</th>
                <th class="text-center" style="width: 100px">Aksi</th>
              </tr>
            </thead>
            <tbody id="tbody-transaksi">
              <tr>
                <td colspan="8" class="text-center py-4">
                  <div class="spinner-border text-primary"></div>
                  <p class="mt-2 mb-0 text-muted">Memuat data...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted" id="info-count">0 transaksi</small>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal Detail Transaksi -->
  <div class="modal fade" id="modal-detail" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-receipt me-2"></i>
            Detail Transaksi
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modal-detail-body">
          <!-- Will be filled by JS -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary" id="btn-print-detail">
            <i class="bi bi-printer me-2"></i>
            Print
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/transaksi-keluar.js"></script>
</body>
</html>
